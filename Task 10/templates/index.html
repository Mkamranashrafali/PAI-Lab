<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Information Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
    <div class="page">
        <div class="chat-card">
            <h1>Hotel Information Chatbot</h1>
            <p class="sub">Ask about rooms, prices, amenities, or booking.</p>

            <div id="chatBox" class="chat-box">
                <div class="msg bot">Hello! Ask me anything about our hotel rooms and booking details.</div>
            </div>

            <div class="input-row">
                <input id="userInput" type="text" placeholder="Type your message" />
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox')
        const userInput = document.getElementById('userInput')
        const sendBtn = document.getElementById('sendBtn')

        function addMessage(text, sender) {
            const msg = document.createElement('div')
            msg.className = `msg ${sender}`
            msg.textContent = text
            chatBox.appendChild(msg)
            chatBox.scrollTop = chatBox.scrollHeight
        }

        async function sendMessage() {
            const text = userInput.value.trim()
            if (!text) return

            addMessage(text, 'user')
            userInput.value = ''

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })

            const data = await res.json()
            addMessage(data.reply, 'bot')
        }

        sendBtn.addEventListener('click', sendMessage)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage()
        })
    </script>
</body>

</html>
